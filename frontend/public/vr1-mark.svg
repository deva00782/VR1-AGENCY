<svg width="480" height="220" viewBox="0 0 480 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3F4F4"/>
      <stop offset="17%" stop-color="#DBDBDB"/>
      <stop offset="34%" stop-color="#FCFCFC"/>
      <stop offset="52%" stop-color="#C3C3C3"/>
      <stop offset="70%" stop-color="#F3F3F3"/>
      <stop offset="100%" stop-color="#949494"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9EF7BE"/>
      <stop offset="30%" stop-color="#52E38F"/>
      <stop offset="60%" stop-color="#26C868"/>
      <stop offset="100%" stop-color="#0BA95D"/>
    </linearGradient>
    <linearGradient id="greenStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#25D977"/>
      <stop offset="100%" stop-color="#0CB765"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#22C55E" flood-opacity="0.38"/>
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#22C55E" flood-opacity="0.2"/>
    </filter>
    <filter id="metalShadow" x="-15%" y="-15%" width="130%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g transform="translate(12 0)" filter="url(#metalShadow)">
    <text x="0" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="210" font-weight="900" letter-spacing="-22" fill="url(#metal)">VR</text>
    <text x="300" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="210" font-weight="900" letter-spacing="-22" fill="url(#greenGlow)" filter="url(#softGlow)">1</text>
  </g>
</svg>
