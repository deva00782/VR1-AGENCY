<svg width="1200" height="540" viewBox="0 0 1200 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3F4F4"/>
      <stop offset="17%" stop-color="#DBDBDB"/>
      <stop offset="34%" stop-color="#FCFCFC"/>
      <stop offset="52%" stop-color="#C3C3C3"/>
      <stop offset="70%" stop-color="#F3F3F3"/>
      <stop offset="100%" stop-color="#8E8E8E"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9EF7BE"/>
      <stop offset="30%" stop-color="#52E38F"/>
      <stop offset="60%" stop-color="#26C868"/>
      <stop offset="100%" stop-color="#0BA95D"/>
    </linearGradient>
    <linearGradient id="greenLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2ADE79"/>
      <stop offset="100%" stop-color="#0AAC51"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#22C55E" flood-opacity="0.42"/>
      <feDropShadow dx="0" dy="0" stdDeviation="24" flood-color="#22C55E" flood-opacity="0.18"/>
    </filter>
    <filter id="metalShadow" x="-15%" y="-15%" width="130%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g transform="translate(28 10)" filter="url(#metalShadow)">
    <text x="0" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="270" font-weight="900" letter-spacing="-26" fill="url(#metal)">VR</text>
    <text x="590" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="270" font-weight="900" letter-spacing="-26" fill="url(#greenGlow)" filter="url(#softGlow)">1</text>
  </g>

  <g transform="translate(170 285)">
    <text x="0" y="0" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="400" letter-spacing="16" fill="#F0F0F0">WE ARE ONE</text>
    <text x="68" y="75" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="11" fill="#D4D4D4">DIGITAL GROWTH &amp; WEB STUDIO</text>
  </g>

  <g transform="translate(235 420)">
    <path d="M0 0H255" stroke="url(#greenLine)" stroke-width="2" opacity="0.9"/>
    <text x="305" y="8" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="10" fill="#E7E7E7">IDEAS</text>
    <text x="510" y="8" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="10" fill="#E7E7E7">WEBSITES</text>
    <text x="770" y="8" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="10" fill="#E7E7E7">GROWTH</text>
    <path d="M940 0H1180" stroke="url(#greenLine)" stroke-width="2" opacity="0.9"/>
  </g>
</svg>
